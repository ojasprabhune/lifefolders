<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta id="theme-color-meta" name="theme-color" content="#fbf3ea" />
    <script>
      // Applied before the stylesheet paints, so the resolved theme doesn't
      // flash the wrong color on load, and the browser chrome/status bar
      // tint matches it. The theme itself rotates once per calendar day to
      // a random pick from the dark family (never 'light') - life_theme_day
      // is the date the current pick was made for, so reloads within the
      // same day keep whatever that day already landed on instead of
      // re-rolling, and a manual choice from the guide only lasts until the
      // next day's roll.
      try {
        var darkThemes = ['dark', 'slate', 'graphite', 'teal', 'atlantic', 'moss', 'plum', 'clay']
        var colors = {
          light: '#fbf3ea',
          dark: '#1c1713',
          slate: '#10131a',
          graphite: '#121212',
          teal: '#0f1613',
          atlantic: '#0d151c',
          moss: '#121710',
          plum: '#16121a',
          clay: '#181410',
        }
        var today = new Date().toDateString()
        var stored = localStorage.getItem('life_theme')
        if (localStorage.getItem('life_theme_day') !== today || !colors[stored]) {
          stored = darkThemes[Math.floor(Math.random() * darkThemes.length)]
          localStorage.setItem('life_theme', stored)
          localStorage.setItem('life_theme_day', today)
        }
        document.documentElement.setAttribute('data-theme', stored)
        document.getElementById('theme-color-meta').setAttribute('content', colors[stored])
      } catch (e) {}
      // Same rotation shape as the color theme above, kept in its own
      // try/catch and its own day key (life_font_day) so the two rotate
      // independently of each other.
      try {
        var fontThemes = ['folio', 'press', 'signal']
        var todayFont = new Date().toDateString()
        var storedFont = localStorage.getItem('life_font')
        if (localStorage.getItem('life_font_day') !== todayFont || fontThemes.indexOf(storedFont) === -1) {
          storedFont = fontThemes[Math.floor(Math.random() * fontThemes.length)]
          localStorage.setItem('life_font', storedFont)
          localStorage.setItem('life_font_day', todayFont)
        }
        document.documentElement.setAttribute('data-font', storedFont)
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="life" />
    <link rel="stylesheet" href="https://use.typekit.net/hck5xcw.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;1,400;0,700&display=swap"
    />
    <title>life</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
