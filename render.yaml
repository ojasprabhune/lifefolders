services:
  - type: web
    name: lifefolders-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: WGER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RECAP_TO
        sync: false
      - key: RECAP_FROM
        sync: false
      - key: RECAP_TZ_OFFSET_MIN
        sync: false
